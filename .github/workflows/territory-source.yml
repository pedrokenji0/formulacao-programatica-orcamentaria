name: Atualizar malha IBGE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Consultar fonte oficial IBGE
        run: node scripts/territory-source.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: territorio-ibge
          path: |
            data/territorio/
            public/data/mg-municipios.json
