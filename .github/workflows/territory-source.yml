name: Preparar malha municipal
on:
  push:
    branches: [codex/mapa-territorial-minas-gerais]
    paths: [.github/workflows/territory-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Consultar fonte oficial IBGE
        run: node scripts/territory-source.mjs
