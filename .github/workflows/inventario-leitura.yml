name: Validar inventário documental
on:
  push:
    branches: [codex/inventario-dados]
    paths:
      - docs/inventario/**
      - .github/workflows/inventario-leitura.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet jsonschema==4.25.1
      - name: Conferir documentação e esquemas oficiais
        run: python docs/inventario/validar.py --padrao
