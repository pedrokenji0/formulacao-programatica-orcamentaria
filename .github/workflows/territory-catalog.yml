name: Gerar catálogo territorial dos projetos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/territory-planning-catalog.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalogo-territorial-planejamento
          path: data/territorio/planejamento-projetos.json
